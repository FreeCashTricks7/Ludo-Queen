<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ludo Queen</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; user-select: none; }
        body { background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }

        /* Menu Screen */
        #menu-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; width: 90%; max-width: 400px; }
        .title { font-size: 32px; font-weight: bold; color: #f1c40f; text-shadow: 0 4px 10px rgba(241, 196, 15, 0.4); }
        .btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; transition: 0.2s; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .btn-primary { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-secondary { background: linear-gradient(135deg, #11998e, #38ef7d); }
        .btn:active { transform: scale(0.96); }

        /* Game Screen */
        #game-screen { display: none; flex-direction: column; align-items: center; gap: 15px; width: 100%; max-width: 420px; }

        /* 15x15 Ludo Board Grid */
        .ludo-board {
            width: 360px; height: 360px; display: grid;
            grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr);
            background: #fff; border: 4px solid #222; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .cell { border: 1px solid #ddd; position: relative; display: flex; align-items: center; justify-content: center; }
        
        /* Bases */
        .base-red { grid-column: 1 / 7; grid-row: 1 / 7; background: #e74c3c; padding: 12px; }
        .base-green { grid-column: 10 / 16; grid-row: 1 / 7; background: #2ecc71; padding: 12px; }
        .base-yellow { grid-column: 10 / 16; grid-row: 10 / 16; background: #f1c40f; padding: 12px; }
        .base-blue { grid-column: 1 / 7; grid-row: 10 / 16; background: #3498db; padding: 12px; }
        .base-inner { background: #fff; width: 100%; height: 100%; border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 8px; }

        /* Center / Home */
        .center-home { grid-column: 7 / 10; grid-row: 7 / 10; background: conic-gradient(#e74c3c 0 90deg, #2ecc71 90deg 180deg, #f1c40f 180deg 270deg, #3498db 270deg 360deg); }

        /* Paths & Colors */
        .path-red { background: #ff7675; }
        .path-green { background: #55efc4; }
        .path-yellow { background: #ffeaa7; }
        .path-blue { background: #74b9ff; }
        .star-cell::after { content: '★'; font-size: 14px; color: #555; }

        /* Tokens (गोटियाँ) */
        .token { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.4); cursor: pointer; z-index: 10; transition: transform 0.2s; }
        .token-red { background: #d63031; }
        .token-green { background: #00b894; }
        .token-yellow { background: #fdcb6e; }
        .token-blue { background: #0984e3; }

        /* Controls & Dice */
        .controls { display: flex; align-items: center; justify-content: space-between; width: 360px; padding: 10px; background: #222; border-radius: 12px; }
        .turn-indicator { font-size: 16px; font-weight: bold; }
        .dice { width: 50px; height: 50px; background: #fff; color: #222; font-size: 30px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <!-- Main Menu -->
    <div id="menu-screen">
        <h1 class="title">👑 LUDO QUEEN 👑</h1>
        <p id="player-name">स्वागत है, खिलाड़ी!</p>
        <button class="btn btn-primary" onclick="startGame(2)">2 Players (1v1)</button>
        <button class="btn btn-secondary" onclick="startGame(4)">4 Players (Classic)</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <div class="controls">
            <div class="turn-indicator" id="turn-text">चाल: Red</div>
            <div class="dice" id="dice" onclick="rollDice()">🎲</div>
        </div>

        <div class="ludo-board">
            <!-- Bases -->
            <div class="base-red"><div class="base-inner">
                <div class="cell"><div class="token token-red" onclick="moveToken('red', 1)"></div></div>
                <div class="cell"><div class="token token-red" onclick="moveToken('red', 2)"></div></div>
                <div class="cell"><div class="token token-red" onclick="moveToken('red', 3)"></div></div>
                <div class="cell"><div class="token token-red" onclick="moveToken('red', 4)"></div></div>
            </div></div>
            
            <div class="base-green"><div class="base-inner">
                <div class="cell"><div class="token token-green" onclick="moveToken('green', 1)"></div></div>
                <div class="cell"><div class="token token-green" onclick="moveToken('green', 2)"></div></div>
                <div class="cell"><div class="token token-green" onclick="moveToken('green', 3)"></div></div>
                <div class="cell"><div class="token token-green" onclick="moveToken('green', 4)"></div></div>
            </div></div>

            <div class="center-home"></div>

            <div class="base-blue"><div class="base-inner">
                <div class="cell"><div class="token token-blue" onclick="moveToken('blue', 1)"></div></div>
                <div class="cell"><div class="token token-blue" onclick="moveToken('blue', 2)"></div></div>
                <div class="cell"><div class="token token-blue" onclick="moveToken('blue', 3)"></div></div>
                <div class="cell"><div class="token token-blue" onclick="moveToken('blue', 4)"></div></div>
            </div></div>

            <div class="base-yellow"><div class="base-inner">
                <div class="cell"><div class="token token-yellow" onclick="moveToken('yellow', 1)"></div></div>
                <div class="cell"><div class="token token-yellow" onclick="moveToken('yellow', 2)"></div></div>
                <div class="cell"><div class="token token-yellow" onclick="moveToken('yellow', 3)"></div></div>
                <div class="cell"><div class="token token-yellow" onclick="moveToken('yellow', 4)"></div></div>
            </div></div>
        </div>
        
        <button class="btn btn-primary" style="width: 360px; padding: 10px;" onclick="location.reload()">Main Menu</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('player-name').innerText = `खिलाड़ी: ${tg.initDataUnsafe.user.first_name}`;
        }

        // Web Audio API for Pure Custom Sounds (No External Links Needed)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'dice') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'move') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        let playersCount = 2;
        let currentDiceValue = 1;
        const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

        function startGame(mode) {
            playersCount = mode;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        function rollDice() {
            playSound('dice');
            const diceEl = document.getElementById('dice');
            let count = 0;
            const interval = setInterval(() => {
                diceEl.innerText = diceFaces[Math.floor(Math.random() * 6)];
                count++;
                if (count > 8) {
                    clearInterval(interval);
                    currentDiceValue = Math.floor(Math.random() * 6) + 1;
                    diceEl.innerText = diceFaces[currentDiceValue - 1];
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                }
            }, 50);
        }

        function moveToken(color, tokenId) {
            playSound('move');
            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        }
    </script>
</body>
</html>
